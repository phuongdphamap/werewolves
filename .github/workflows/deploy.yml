# Publishes main to GitHub Pages.
#
# Reusable only — it has no trigger of its own on purpose. Callers are responsible
# for gating on the test suite first: release.yml calls it after tagging, static.yml
# calls it after testing a manual redeploy.
name: Deploy

on:
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time. A run in progress is never cancelled — a half-finished
# Pages publish is worse than a queued one.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      # Always main, never the caller's triggering commit. On the release path that
      # commit predates the sw.js version bump, so deploying it would publish the
      # new app under the old cache key.
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          # Upload entire repository
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
