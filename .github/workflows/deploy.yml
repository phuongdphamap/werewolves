# Publishes main to GitHub Pages.
#
# Reusable only — it has no trigger of its own on purpose. Callers are responsible
# for gating on the test suite first: release.yml calls it after tagging, static.yml
# calls it after testing a manual redeploy.
name: Deploy

on:
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time. A run in progress is never cancelled — a half-finished
# Pages publish is worse than a queued one.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      # Always main, never the caller's triggering commit. On the release path that
      # commit predates the sw.js version bump, so deploying it would publish the
      # new app under the old cache key.
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0 # tags, for the version pin below

      # What ships must carry the released version, or the service worker cache never
      # rotates and nobody receives the update. On the PR path main already has it and
      # this is a no-op; on a manual release nothing wrote it to main, so this is the
      # only thing that gets it right. Runner-only — never committed.
      - name: Pin sw.js to the released version
        run: |
          set -euo pipefail
          tag=$(git tag --list 'v*' --sort=-v:refname \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n1 || true)
          if [ -z "$tag" ]; then echo "No release tag yet, deploying as-is."; exit 0; fi
          sed -i "s|^const VERSION = '.*';|const VERSION = 'mh-${tag}';|" sw.js
          grep -q "const VERSION = 'mh-${tag}';" sw.js || {
            echo "::error::could not rewrite VERSION in sw.js"; exit 1; }
          echo "Deploying as $tag"

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          # Upload entire repository
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
