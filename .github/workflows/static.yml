# Redeploys main to Pages by hand, without cutting a release.
#
# For recovering a broken Pages build, or republishing after changing repo settings.
# Normal releases deploy themselves — see release.yml. There is no push trigger: a
# push-triggered deploy would publish before the release had bumped sw.js, so the new
# app would go out under the old cache key.
name: Deploy static content to Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  # Dispatched by a person, so it verifies main is green rather than trusting them.
  test:
    uses: ./.github/workflows/test.yml
    with:
      ref: main

  deploy:
    needs: test
    uses: ./.github/workflows/deploy.yml
