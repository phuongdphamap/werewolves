# Cuts a release when a PR carrying a release:* label is merged into main, or on
# demand from the Actions tab. The label (or the input) picks the semver bump. The
# deploy writes that version into sw.js, so nothing here edits a file.
name: Release

on:
  pull_request:
    types: [closed]
    branches: ["main"]

  # Cut a release without a PR — a cache refresh or a re-release needs no diff.
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump
        type: choice
        required: true
        default: patch
        options: [patch, minor, major]

# One release at a time — two merges landing together must not race on the tag.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write # push the tag
  actions: write # dispatch the Pages deploy — see the note on that step

jobs:
  release:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.merged == true &&
       (contains(github.event.pull_request.labels.*.name, 'release:major') ||
        contains(github.event.pull_request.labels.*.name, 'release:minor') ||
        contains(github.event.pull_request.labels.*.name, 'release:patch')))
    runs-on: ubuntu-latest
    steps:
      # main, not the event's ref: on a labelled merge this runs on pull_request:closed,
      # where the default ref is refs/pull/N/merge and can be gone once merged.
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      # Nothing below runs if the suites fail, so the tag and the deploy are gated
      # without needing a second job.
      - uses: ./.github/actions/run-tests

      # Tags are the only source of truth for what has shipped. sw.js in the repo is a
      # placeholder — static.yml writes the real version into the artifact from the tag,
      # so nothing here has to edit a file or push to a branch. That is what keeps main
      # protectable and keeps any bot off your pull request branches.
      - name: Work out the next version
        id: next
        env:
          EVENT: ${{ github.event_name }}
          INPUT_BUMP: ${{ inputs.bump }}
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "workflow_dispatch" ]; then
            bump="$INPUT_BUMP"
          elif jq -e 'index("release:major")' <<<"$LABELS" >/dev/null; then
            bump='major'
          elif jq -e 'index("release:minor")' <<<"$LABELS" >/dev/null; then
            bump='minor'
          else
            bump='patch'
          fi

          previous=$(git tag --list 'v*' --sort=-v:refname \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n1 || true)
          previous=${previous:-v0.0.0}

          # npm's semver is the reference implementation of the spec. It handles
          # prerelease and build-metadata tags, and rejects a malformed version
          # instead of doing shell arithmetic on it.
          version="v$(npx --yes semver@7 --increment "$bump" "${previous#v}")"

          {
            echo "previous=$previous"
            echo "version=$version"
          } >> "$GITHUB_OUTPUT"
          echo "Releasing $previous -> $version ($bump)"

      - name: Tag it
        env:
          VERSION: ${{ steps.next.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # A tag, never a branch — main is protected and nothing here needs a bypass.
          git tag -a "$VERSION" -m "$VERSION"
          git push origin "$VERSION"

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.next.outputs.version }}
          PREVIOUS: ${{ steps.next.outputs.previous }}
        run: |
          set -euo pipefail
          notes_flag=(--generate-notes)
          if git rev-parse "$PREVIOUS" >/dev/null 2>&1; then
            notes_flag+=(--notes-start-tag "$PREVIOUS")
          fi
          gh release create "$VERSION" --title "$VERSION" --verify-tag "${notes_flag[@]}"

      # Dispatch static.yml rather than running the deploy steps here. The github-pages
      # environment only permits deploys from main, and it checks the RUN's ref — on a
      # labelled merge this workflow runs on pull_request:closed, so its ref is
      # refs/pull/N/merge and the environment rejects it no matter what the job checks
      # out. Only --ref main creates a run whose ref really is main. Missing this broke
      # the v0.2.0 release: it tagged and published, then failed to deploy.
      #
      # skip_tests because the suites ran against this exact tree above and this job
      # pushes only a tag — nothing changed in between. A hand dispatch of static.yml
      # leaves the flag off and runs them.
      - name: Deploy the new version
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run static.yml --ref main -f skip_tests=true
