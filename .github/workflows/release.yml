# Cuts a release when a PR carrying a release:* label is merged into main, or on
# demand from the Actions tab. The label (or the input) picks the semver bump;
# sw.js VERSION is synced to the new tag so the service worker cache invalidates.
name: Release

on:
  pull_request:
    types: [closed]
    branches: ["main"]

  # Cut a release without a PR — a cache refresh or a re-release needs no diff.
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump
        type: choice
        required: true
        default: patch
        options: [patch, minor, major]

# One release at a time — two merges landing together must not race on the tag.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write # push the version-bump commit and the tag
  actions: write # dispatch the Pages deploy — see the note on that step

jobs:
  # Nothing is tagged, released or deployed unless the suites pass.
  test:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.merged == true &&
       (contains(github.event.pull_request.labels.*.name, 'release:major') ||
        contains(github.event.pull_request.labels.*.name, 'release:minor') ||
        contains(github.event.pull_request.labels.*.name, 'release:patch')))
    uses: ./.github/workflows/test.yml
    with:
      ref: main

  release:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      # sw.js is the source of truth here, not the tag list. bump.yml already wrote
      # the version into the PR, so main carries it before this ever runs — which is
      # what lets main be protected: nothing below pushes to a branch.
      - name: Read the version off main
        id: next
        env:
          EVENT: ${{ github.event_name }}
          INPUT_BUMP: ${{ inputs.bump }}
        run: |
          set -euo pipefail
          previous=$(git tag --list 'v*' --sort=-v:refname \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n1 || true)
          previous=${previous:-v0.0.0}

          if [ "$EVENT" = "workflow_dispatch" ]; then
            # No PR to have bumped anything, so derive it and edit in the runner only.
            version="v$(npx --yes semver@7 --increment "$INPUT_BUMP" "${previous#v}")"
            sed -i "s|^const VERSION = '.*';|const VERSION = 'mh-${version}';|" sw.js
            echo "Manual release: $previous -> $version ($INPUT_BUMP)"
          else
            version=$(sed -n "s|^const VERSION = 'mh-\(v[0-9.]*\)';|\1|p" sw.js)
            [ -n "$version" ] || {
              echo "::error::no version in sw.js — was the PR labelled so bump.yml could set it?"
              exit 1
            }
            echo "Releasing $version, as written into sw.js by the PR"
          fi

          if git rev-parse "$version" >/dev/null 2>&1; then
            echo "::error::tag $version already exists. Re-label the PR so bump.yml picks the next one."
            exit 1
          fi

          {
            echo "previous=$previous"
            echo "version=$version"
          } >> "$GITHUB_OUTPUT"

      - name: Tag it
        env:
          VERSION: ${{ steps.next.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # A tag, never a branch — main is protected and nothing here needs a bypass.
          git tag -a "$VERSION" -m "$VERSION"
          git push origin "$VERSION"

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.next.outputs.version }}
          PREVIOUS: ${{ steps.next.outputs.previous }}
        run: |
          set -euo pipefail
          notes_flag=(--generate-notes)
          if git rev-parse "$PREVIOUS" >/dev/null 2>&1; then
            notes_flag+=(--notes-start-tag "$PREVIOUS")
          fi
          gh release create "$VERSION" --title "$VERSION" --verify-tag "${notes_flag[@]}"

      # Dispatch rather than calling deploy.yml directly. Two separate reasons, and
      # missing the second one broke the v0.2.0 release:
      #
      #  1. A push made with GITHUB_TOKEN does not trigger other workflows, so the
      #     bump above would never ship on its own.
      #  2. The github-pages environment only permits deploys from main. On a
      #     labelled merge this workflow runs on the pull_request event, so its ref
      #     is refs/pull/N/merge and the environment REJECTS it — regardless of what
      #     the deploy job checks out. Dispatching with --ref main creates a run
      #     whose ref really is main, which is the only thing that satisfies it.
      #
      # This costs one extra test run, because the dispatched workflow gates itself.
      # That is the price of a deploy that is both test-gated and permitted to run.
      - name: Deploy the new version
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run static.yml --ref main
