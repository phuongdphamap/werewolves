# The pull request check. This is the only workflow that runs the suites on its own
# trigger, and the `test` job name is the context main's branch protection requires.
#
# Deliberately no `push: main` trigger. A squash merge tests the same tree the PR already
# tested, and the release and deploy each run the suites themselves — a push trigger only
# added a fourth concurrent run per release.
name: Tests

on:
  pull_request:
    branches: ["main"]

  # Run the suites against any ref by hand, from the Actions tab.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - uses: ./.github/actions/run-tests
