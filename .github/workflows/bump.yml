# Writes the version bump into the pull request itself, so main is only ever changed
# by a PR merge. That is what lets main require the test check: nothing pushes to it
# directly, so nothing needs a bypass.
#
# Label a PR release:patch / release:minor / release:major and this commits the
# matching sw.js VERSION onto the PR branch.
name: Bump

on:
  pull_request:
    types: [labeled]
    branches: ["main"]

permissions:
  contents: write # commit the bump to the PR branch
  actions: write # re-run the tests on it — see the note on that step

concurrency:
  group: bump-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  bump:
    # Only our own branches: a fork's head lives in the fork, so it cannot be pushed
    # to, and giving contents:write to a fork PR would be handing out the token.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.event.label.name, 'release:')
    runs-on: ubuntu-latest
    steps:
      # By SHA, not by branch name: it pins exactly what the event referred to, and
      # keeps an untrusted ref out of the checkout.
      - name: Checkout the commit this PR is at
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Work out the version this PR will release
        id: next
        env:
          LABEL: ${{ github.event.label.name }}
        run: |
          set -euo pipefail
          case "$LABEL" in
            'release:major') bump='major' ;;
            'release:minor') bump='minor' ;;
            *)               bump='patch' ;;
          esac

          # Tags are the source of truth for what has shipped.
          previous=$(git tag --list 'v*' --sort=-v:refname \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n1 || true)
          previous=${previous:-v0.0.0}
          version="v$(npx --yes semver@7 --increment "$bump" "${previous#v}")"

          {
            echo "version=$version"
            echo "previous=$previous"
          } >> "$GITHUB_OUTPUT"
          echo "This PR would release $previous -> $version ($bump)"

      - name: Write it into sw.js
        id: sw
        env:
          VERSION: ${{ steps.next.outputs.version }}
        run: |
          set -euo pipefail
          sed -i "s|^const VERSION = '.*';|const VERSION = 'mh-${VERSION}';|" sw.js
          grep -q "const VERSION = 'mh-${VERSION}';" sw.js || {
            echo "::error::could not rewrite VERSION in sw.js — check the line format"
            exit 1
          }
          if git diff --quiet sw.js; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Already at ${VERSION}, nothing to do."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit it to the PR branch
        if: steps.sw.outputs.changed == 'true'
        env:
          VERSION: ${{ steps.next.outputs.version }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sw.js
          git commit -m "chore: set version ${VERSION}"
          # A non-fast-forward rejection here is correct: it means the branch moved
          # after the label, so the bump is being computed against a stale head.
          git push origin "HEAD:refs/heads/${BRANCH}"

      # A push made with GITHUB_TOKEN creates no workflow run, so the commit above
      # would carry no test check and the PR could never satisfy the required one.
      # workflow_dispatch is the documented exception: it always creates a run.
      - name: Run the suites against the bumped commit
        if: steps.sw.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: gh workflow run test.yml --ref "$BRANCH"
