<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0C0A12">
<meta name="description" content="Quản Trò assistant for Ma Sói / The Werewolves of Miller’s Hollow: deck building, night call order, dawn resolution and vote counting.">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ma Sói">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="./icons/icon-192.png">
<title>Miller’s Hollow — Moderator</title>
<!-- Both faces are self-hosted (see css/app.css). Nothing on this page reaches another
     origin, which is the point of an app used in a cellar with no signal. -->
<link rel="stylesheet" href="./css/app.css">
<!-- Both subsets of both faces. Only the latin halves were hinted, in a Vietnamese-first
     app: on a cold open the diacritics were the last thing to arrive, in the language
     that leads. Four files, 62 KB. -->
<link rel="preload" href="./fonts/bevietnampro-500-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="./fonts/bevietnampro-500-vietnamese.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="./fonts/lora-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="./fonts/lora-vietnamese.woff2" as="font" type="font/woff2" crossorigin>
</head>
<body>

<div class="wrap">
  <header>
    <div style="flex:1;min-width:0">
      <div class="ttl" id="hTtl">Setup</div>
      <div class="ph" id="hPh">Who is playing</div>
    </div>
    <button type="button" class="ico quiet" id="bUndo"></button>
    <button type="button" class="ico" id="bRoster"></button>
  </header>

  <!-- 1. seats -->
  <section class="on" id="sPlayers">
    <h2 id="pTtl"></h2>
    <p class="sub" id="pSub"></p>
    <div class="card">
      <div class="row tall"><input type="text" id="iName" placeholder="Player name" autocomplete="off"
        autocapitalize="words" spellcheck="false" enterkeyhint="done">
        <button type="button" class="btn" id="bAdd">Add</button></div>
      <p class="note" id="pCount">No players yet.</p>
    </div>
    <div class="ros group" id="lPlayers"></div>
  </section>

  <!-- 2. deck -->
  <section id="sRoles">
    <h2 id="rTtl"></h2>
    <p class="sub" id="rSub"></p>
    <div class="tally">
      <div class="tl"><div class="v" id="tCards">0</div><div class="k">cards</div></div>
      <div class="tl"><div class="v" id="tSeats">0</div><div class="k">seats</div></div>
      <div class="tl bad"><div class="v" id="tWolves">0</div><div class="k">wolves</div></div>
    </div>
    <div class="stack" id="recBox"></div>
    <div class="stack" id="advice"></div>
    <div class="roles" id="lRoles"></div>
  </section>

  <!-- 3. physical deal -->
  <section id="sDeal">
    <h2 id="dTtl"></h2>
    <p class="sub" id="dSub"></p>
    <div class="deal group" id="dealList"></div>
    <p class="note" id="dealNote" style="margin-top:var(--s4)"></p>
    <div class="stack" id="dealAlt"></div>
  </section>

  <!-- 3b. collect the deal -->
  <section id="sLearn">
    <h2 id="lTtl"></h2>
    <p class="sub" id="lSub"></p>
    <div class="stack" id="lrBody"></div>
  </section>

  <!-- 4. night -->
  <section id="sNight">
    <!-- Progress through the night, as a 2px rule rather than the 10px caption it was.
         The header keeps the words; this is here to be read without being read. -->
    <div class="steps" id="nStep" role="progressbar" aria-label="progress through the night"><span></span></div>
    <h2 id="nTitle">—</h2>
    <p class="sub" id="nSub"></p>
    <!-- A hushed call's notice belongs ABOVE the line to be read out. Below it, the screen
         led with the role name and an instruction to act, and read as though the power
         still worked — which is exactly how it was reported from a table. -->
    <div class="stack preSay" id="nHush"></div>
    <div class="say" id="nSay"><div class="lbl" id="nSayLbl"></div><p id="nSayT"></p>
      <button type="button" class="altBtn" id="bAltLang" hidden>Show English</button></div>
    <div class="stack" id="nBody"></div>
  </section>

  <!-- 5. dawn -->
  <section id="sDawn">
    <h2 id="dwTitle">Dawn breaks</h2>
    <p class="sub" id="dwSub">The rules have already settled the night. Read it out, then move to the day.</p>
    <div class="stack" id="dwBody"></div>
  </section>

  <!-- 6. day -->
  <section id="sDay">
    <h2 id="dyTitle">The village debates</h2>
    <p class="sub" id="dySub"></p>
    <div class="stack" id="dyBody"></div>
  </section>

  <!-- 7. end -->
  <section id="sEnd">
    <h2 id="enTitle">—</h2>
    <p class="sub" id="enSub"></p>
    <div class="stack" id="enCard"></div>
    <div class="grp" id="enChronicle"></div>
    <div class="log" id="enLog"></div>
  </section>

  <div class="bar"><div class="barnote" id="barNote" hidden></div><div class="in" id="bar"></div></div>
</div>

<!-- Done sits ABOVE the hold button. This phone is in another player's hand, and the
     two were stacked full-width with Done the lower of the pair — nearest where a
     player grips, one release away from dismissing the reveal they were handed. -->
<div class="modal seer" id="mSeer"><div class="in seerin">
  <button type="button" class="btn sec done" id="bSeerDone">Done</button>
  <div class="skick" id="revKick">Turn the screen</div>
  <div class="swho" id="seerWho">—</div>
  <div class="secret" id="revSecret" aria-hidden="true">
    <div class="sname" id="seerName">—</div>
    <div class="steam" id="seerTeam">—</div>
  </div>
  <button type="button" class="btn wide hold" id="bReveal">Hold to see it</button>
</div></div>

<div class="modal" id="mRoster"><div class="in">
  <div class="row" style="margin-bottom:var(--s4)"><h2 style="flex:1;margin:0" id="rosTtl"></h2>
    <!-- Night sounds live here, not the header: used once a night, and the header's
         strip is worth more than a control that rarely moves. Haptics sit beside them —
         same kind of setting, and hidden entirely where the browser has no vibrator. -->
    <button type="button" class="ico" id="bSound" title="Night sounds"></button>
    <button type="button" class="ico" id="bHaptic" title="Haptic feedback" hidden></button>
    <button type="button" class="ico" id="bCloseR"></button></div>
  <p class="sub" id="rosSub" style="margin-bottom:var(--s3)"></p>
  <div class="stack" id="rosBody"></div>
  <div class="grp" id="rosChronicle"></div>
  <div class="log" id="rosLog"></div>
  <p class="sub" id="rosVer" style="margin-top:var(--s3)"></p>
</div></div>

<script src="./js/app.js"></script>
</body>
</html>
